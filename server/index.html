<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Songs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=41">
</head>
<body>
<div class="aurora"></div>

<div id="login">
  <div class="login-box">
    <div class="login-head">
      <svg class="ic" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <h2 class="display">TikTok Songs</h2>
      <div class="sub" id="login-mode">Anmelden</div>
    </div>
    <input type="text" id="user" placeholder="Benutzername" autocomplete="username">
    <input type="password" id="pass" placeholder="Passwort" autocomplete="current-password">
    <div class="err" id="login-err"></div>
    <button class="btn-primary" id="login-btn">Anmelden</button>
    <button class="link-btn" id="toggle-register">Neu hier? Konto erstellen</button>
    <div class="downloads">
      <a class="btn-ghost" href="/app.apk" download="musik_app.apk">
        <svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        Download APK &mdash; Android</a>
      <a class="btn-ghost" href="/extension.zip" download="tiktok_songs_extension.zip">
        <svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        Download Browser Extension</a>
      <span class="btn-ghost dead">iPhone nicht verf&uuml;gbar, au&szlig;er ihr wollt 100&thinsp;&euro; zahlen</span>
      <button class="btn-ghost" id="howto-btn">Wie benutze ich es?</button>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <div class="titles">
      <h1 class="display">Deine Sounds</h1>
      <div class="sub" id="whoami"></div>
    </div>
    <button class="icon-btn" id="profile" title="Konto">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
    </button>
  </div>
  <div class="chips" id="stats"></div>
  <div class="chips" id="filters"></div>
  <input type="search" id="search" placeholder="Song oder Artist suchen…">
  <div id="list"></div>
</div>

<div id="playerbar">
  <div id="pb-cover"></div>
  <div id="pb-meta"><b id="pb-name"></b><span id="pb-artist"></span></div>
  <button id="pb-toggle"></button>
  <span class="pb-time" id="pb-cur">0:00</span>
  <input type="range" id="pb-seek" min="0" max="1000" value="0">
  <span class="pb-time" id="pb-dur">0:00</span>
  <input type="range" id="pb-vol" min="0" max="100">
  <button class="icon-btn bare" id="pb-close" title="Stoppen">
    <svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
</div>

<div id="toast"></div>
<div id="overlays"></div>
<script src="/app.js?v=41"></script>
</body>
</html>
