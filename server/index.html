<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Songs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif;
      user-select: none; -webkit-user-select: none; }
  input, textarea { user-select: text; -webkit-user-select: text; }
  :root {
    --pink: #FE2C55; --cyan: #25F4EE; --violet: #7828C8; --gold: #F5C542; --green: #4CD964;
    --text: #F5F5FA; --muted: #A2A2AE; --glass: rgba(255,255,255,.07); --glass-hover: rgba(255,255,255,.12);
    --border: rgba(255,255,255,.10); --border-strong: rgba(255,255,255,.22);
    --s1: 8px; --s2: 12px; --s3: 16px; --s4: 24px; --s5: 32px;
    --r-card: 18px; --r-pill: 999px; --r-input: 14px;
  }
  html, body { height: 100%; overflow: hidden; }
  body { color: var(--text); background: #09090D; font-size: 15px; line-height: 1.5; }
  .aurora { position: fixed; inset: 0; z-index: -1; background:
    radial-gradient(circle at 15% 0%, rgba(120,40,200,.30), transparent 46%),
    radial-gradient(circle at 100% 35%, rgba(254,44,85,.20), transparent 42%),
    radial-gradient(circle at 35% 100%, rgba(37,100,244,.18), transparent 46%), #09090D; }

  .display { font-family: 'Unbounded', sans-serif; font-weight: 900; letter-spacing: -.5px; }

  /* ---------- Buttons als System ---------- */
  .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 24px; border: none; border-radius: var(--r-pill); cursor: pointer;
    font-size: 15px; font-weight: 700; color: #fff; width: 100%;
    background: linear-gradient(100deg, var(--pink), var(--violet) 55%, var(--cyan) 130%);
    transition: filter .15s, transform .1s; }
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-primary:active { transform: scale(.98); }
  .btn-primary:disabled { background: var(--glass); color: var(--muted); cursor: default; filter: none; }
  .btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 13px 20px; border-radius: var(--r-input); cursor: pointer; width: 100%;
    background: var(--glass); border: 1px solid var(--border); color: var(--text);
    font-size: 14px; font-weight: 600; text-decoration: none; transition: background .15s, border-color .15s; }
  .btn-ghost:hover { background: var(--glass-hover); border-color: var(--border-strong); }
  .btn-ghost.dead { color: var(--muted); font-weight: 400; cursor: default; }
  .btn-ghost.dead:hover { background: var(--glass); border-color: var(--border); }
  .icon-btn { width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center;
    background: var(--glass); border: 1px solid var(--border); border-radius: 50%; color: var(--muted);
    font-size: 17px; cursor: pointer; transition: background .15s, color .15s; flex-shrink: 0; }
  .icon-btn:hover { background: var(--glass-hover); color: #fff; }
  .icon-btn.bare { background: none; border: none; }
  .link-btn { background: none; border: none; color: var(--cyan); cursor: pointer; font-size: 14px; }
  .link-btn:hover { text-decoration: underline; }

  input[type=text], input[type=password], input[type=search] {
    width: 100%; background: rgba(255,255,255,.05); border: 1px solid var(--border);
    border-radius: var(--r-input); color: var(--text); padding: 13px 16px; font-size: 15px; outline: none;
    transition: border-color .15s; }
  input:focus { border-color: var(--cyan); }

  /* ---------- Login ---------- */
  #login { min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
           justify-content: center; padding: var(--s4); overflow-y: auto; }
  .login-box { width: min(400px, 100%); display: flex; flex-direction: column; gap: var(--s2); }
  .login-head { text-align: center; margin-bottom: var(--s3); }
  .login-head .note { font-size: 46px; color: var(--pink); }
  .login-head h2 { font-size: 26px; margin-top: var(--s1); }
  .login-head .sub { margin-top: 2px; }
  .sub { color: var(--muted); font-size: 13px; }
  .err { color: var(--pink); font-size: 13px; min-height: 18px; }
  .downloads { margin-top: var(--s5); display: flex; flex-direction: column; gap: var(--s2);
               padding-top: var(--s4); border-top: 1px solid var(--border); }

  /* ---------- App-Layout ---------- */
  #app { max-width: 780px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column;
         padding: var(--s5) var(--s4) var(--s3); transition: padding-bottom .2s; }
  #app.with-player { padding-bottom: 96px; }
  .topbar { display: flex; align-items: flex-start; gap: var(--s2); margin-bottom: var(--s3); }
  .topbar .titles { flex: 1; min-width: 0; }
  h1 { font-size: clamp(28px, 4vw, 38px); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--s1); margin-bottom: var(--s2); }
  .chip { background: var(--glass); border: 1px solid var(--border); border-radius: var(--r-pill);
          padding: 8px 15px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .chip.click { cursor: pointer; transition: background .15s, color .15s; }
  .chip.click:hover { background: var(--glass-hover); color: #fff; }
  .chip.active { background: rgba(254,44,85,.32); color: #fff; border-color: rgba(254,44,85,.6); }
  .chip.taste { background: rgba(37,244,238,.12); border-color: rgba(37,244,238,.45); color: var(--cyan); cursor: pointer; }
  .chip.taste:hover { background: rgba(37,244,238,.22); }
  #search { margin-bottom: var(--s3); }
  #list { flex: 1; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--r-card);
          padding: var(--s2); background: rgba(0,0,0,.28);
          scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }

  /* ---------- Karten ---------- */
  .card { background: var(--glass); border: 1px solid var(--border); border-radius: var(--r-card);
          padding: var(--s3); margin-bottom: var(--s2); display: flex; align-items: center; gap: var(--s3);
          transition: border-color .15s, background .15s; }
  .card:last-child { margin-bottom: 0; }
  .card:hover { background: var(--glass-hover); }
  .card.playing { border-color: rgba(37,244,238,.5); }
  .cover { width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0; cursor: pointer; overflow: hidden;
           background: var(--glass) center/cover; position: relative; }
  .cover .ply { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                background: rgba(0,0,0,.38); font-size: 19px; color: #fff; transition: background .15s; }
  .cover:hover .ply { background: rgba(0,0,0,.6); }
  .meta { flex: 1; min-width: 0; }
  .meta b { font-size: 15px; font-weight: 600; display: block; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; }
  .meta .artist { font-size: 13px; color: var(--muted); display: block; margin-top: 1px; }
  .badge-row { display: flex; align-items: center; gap: var(--s1); margin-top: 7px; }
  .badge { font-size: 10.5px; font-weight: 600; border-radius: var(--r-pill); padding: 3px 10px; color: #fff; }
  .time { font-size: 11.5px; color: var(--muted); }

  /* ---------- Pending ---------- */
  .pendcard { background: var(--glass); border: 1px solid var(--border); border-radius: var(--r-card);
              padding: var(--s3); margin-bottom: var(--s2); }
  .pendrow { display: flex; align-items: center; gap: var(--s3); color: var(--cyan); font-weight: 600;
             animation: pulse 1.8s ease-in-out infinite; }
  .pendrow small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; margin-top: 1px; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  .spinner { width: 20px; height: 20px; border: 2.5px solid rgba(37,244,238,.25); border-top-color: var(--cyan);
             border-radius: 50%; animation: spin .9s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pendbar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); margin-top: var(--s2);
             overflow: hidden; }
  .pendbar > div { height: 100%; border-radius: 2px; background: var(--cyan); transition: width .8s; }

  /* ---------- Menü (am Anker) ---------- */
  .menu { position: fixed; background: #191921; border: 1px solid var(--border-strong);
          border-radius: 16px; min-width: 240px; z-index: 60; padding: 6px 0;
          box-shadow: 0 14px 44px rgba(0,0,0,.65); }
  .menu h5 { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
             padding: 10px 16px 4px; }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: none;
                 color: var(--text); padding: 10px 16px; font-size: 14px; cursor: pointer; }
  .menu button:hover { background: rgba(255,255,255,.07); }
  .menu button.danger { color: var(--pink); }

  /* ---------- Player ---------- */
  #playerbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: var(--s3);
    width: min(748px, calc(100vw - 32px)); background: rgba(18,18,26,.94); backdrop-filter: blur(16px);
    border: 1px solid var(--border-strong); border-radius: var(--r-card); padding: var(--s2) var(--s3);
    display: none; align-items: center; gap: var(--s2); z-index: 50; }
  #playerbar.on { display: flex; }
  #pb-cover { width: 46px; height: 46px; border-radius: 11px; background: var(--glass) center/cover;
              flex-shrink: 0; }
  #pb-meta { width: 160px; flex-shrink: 0; }
  #pb-meta b { font-size: 13px; font-weight: 600; display: block; white-space: nowrap; overflow: hidden;
               text-overflow: ellipsis; }
  #pb-meta span { font-size: 11px; color: var(--muted); }
  #pb-toggle { background: #fff; color: #000; border: none; border-radius: 50%; width: 40px; height: 40px;
               font-size: 14px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center;
               justify-content: center; }
  #pb-toggle .spinner { border-color: rgba(0,0,0,.2); border-top-color: #000; width: 16px; height: 16px; }
  .pb-time { font-size: 11px; color: var(--muted); width: 36px; text-align: center; flex-shrink: 0;
             font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,.15); outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px;
    border-radius: 50%; background: #fff; }
  #pb-seek { flex: 1; min-width: 60px; accent-color: var(--cyan); }
  #pb-vol { width: 76px; flex-shrink: 0; }

  /* ---------- Overlays ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 80;
             display: flex; align-items: center; justify-content: center; padding: var(--s3); }
  .modal { background: #15151d; border: 1px solid var(--border-strong); border-radius: 22px;
           width: min(540px, 94vw); max-height: 84vh; display: flex; flex-direction: column;
           padding: var(--s4); gap: var(--s2); }
  .modal header { display: flex; align-items: center; gap: var(--s2); }
  .modal header b { flex: 1; font-size: 18px; }
  .modal .body { overflow-y: auto; scrollbar-width: thin; display: flex; flex-direction: column; gap: var(--s2); }
  .mrow { display: flex; align-items: center; gap: var(--s2); }
  .mrow .cover { width: 48px; height: 48px; border-radius: 12px; }
  .mrow .meta b { font-size: 14px; }
  .mrow .add { background: none; border: none; color: var(--cyan); font-size: 21px; cursor: pointer;
               padding: 8px 12px; }
  .mrow .add.done { color: var(--green); cursor: default; }
  .genrebar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); }
  .genrebar > div { height: 100%; border-radius: 3px;
                    background: linear-gradient(90deg, var(--pink), var(--violet)); }

  #toast { position: fixed; bottom: 104px; left: 50%; transform: translateX(-50%); background: #23232d;
           border: 1px solid var(--border-strong); color: var(--text); padding: 11px 22px;
           border-radius: var(--r-pill); font-size: 13px; z-index: 100; opacity: 0;
           transition: opacity .25s; pointer-events: none; }
  #toast.on { opacity: 1; }
  .hidden { display: none !important; }

  @media (max-width: 560px) {
    #app { padding: var(--s3) var(--s2) var(--s2); }
    #pb-meta { width: 90px; }
    .pb-time { display: none; }
  }
</style>
</head>
<body>
<div class="aurora"></div>

<div id="login">
  <div class="login-box">
    <div class="login-head">
      <div class="note">&#9834;</div>
      <h2 class="display">TikTok Songs</h2>
      <div class="sub" id="login-mode">Anmelden</div>
    </div>
    <input type="text" id="user" placeholder="Benutzername" autocomplete="username">
    <input type="password" id="pass" placeholder="Passwort" autocomplete="current-password">
    <div class="err" id="login-err"></div>
    <button class="btn-primary" id="login-btn">Anmelden</button>
    <button class="link-btn" id="toggle-register">Neu hier? Konto erstellen</button>
    <div class="downloads">
      <a class="btn-ghost" href="/app.apk" download="musik_app.apk">&#8681; Download APK &mdash; Android</a>
      <a class="btn-ghost" href="/extension.zip" download="tiktok_songs_extension.zip">&#8681; Download Browser Extension</a>
      <span class="btn-ghost dead">iPhone nicht verf&uuml;gbar, au&szlig;er ihr wollt 100&thinsp;&euro; zahlen</span>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <div class="titles">
      <h1 class="display">Deine Sounds</h1>
      <div class="sub" id="whoami"></div>
    </div>
    <button class="icon-btn" id="reload" title="Aktualisieren">&#8635;</button>
    <button class="icon-btn" id="profile" title="Konto">&#128100;</button>
  </div>
  <div class="chips" id="stats"></div>
  <div class="chips" id="filters"></div>
  <input type="search" id="search" placeholder="Song oder Artist suchen…">
  <div id="list"></div>
</div>

<div id="playerbar">
  <div id="pb-cover"></div>
  <div id="pb-meta"><b id="pb-name"></b><span id="pb-artist"></span></div>
  <button id="pb-toggle">&#9654;</button>
  <span class="pb-time" id="pb-cur">0:00</span>
  <input type="range" id="pb-seek" min="0" max="1000" value="0">
  <span class="pb-time" id="pb-dur">0:00</span>
  <input type="range" id="pb-vol" min="0" max="100">
  <button class="icon-btn bare" id="pb-close" title="Stoppen">&#10005;</button>
</div>

<div id="toast"></div>
<div id="overlays"></div>

<script>
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem("token");
let userName = localStorage.getItem("user") || "";
let isAdmin = false, songs = [], lastPending = [], filter = "ALLE", registerMode = false;
let playing = null, pollTimer = null;

const audio = new Audio();
// Gehör ist logarithmisch: Regler-Wert quadriert ergibt eine brauchbare Lautstärkekurve
const sliderToVolume = (v) => Math.pow(v / 100, 2);
let volSlider = parseInt(localStorage.getItem("volSlider") || "25", 10);
audio.volume = sliderToVolume(volSlider);

const SOURCES = {
  TIKTOK:  { label: "Offizieller Song", color: "rgba(254,44,85,.5)" },
  SHAZAM:  { label: "Per Shazam erkannt", color: "rgba(120,40,200,.6)" },
  CAPTION: { label: "Aus Video-Text gelesen", color: "rgba(245,197,66,.45)" },
  SIMILAR: { label: "Empfehlung", color: "rgba(76,217,100,.45)" },
  ORIGINAL:{ label: "Nicht erkannt", color: "rgba(255,255,255,.18)" },
};
const FILTER_LABEL = { ALLE: "Alle", TIKTOK: "Offiziell", SHAZAM: "Shazam", CAPTION: "Video-Text",
                       SIMILAR: "Empfehlung", ORIGINAL: "Original" };
const STAGE_PROGRESS = { "Wartet": 10, "Video wird geladen": 40, "Song wird erkannt": 75, "Wird gespeichert": 95 };

const sourceOf = (s) => s.similar ? "SIMILAR" : s.recognized ? "SHAZAM" : s.from_caption ? "CAPTION"
  : s.original ? "ORIGINAL" : "TIKTOK";

function toast(text) {
  $("toast").textContent = text;
  $("toast").classList.add("on");
  setTimeout(() => $("toast").classList.remove("on"), 2600);
}

async function api(path, opts = {}) {
  opts.headers = Object.assign({ "X-Token": token || "" }, opts.headers);
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r;
}

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function fmtTime(sec) {
  if (!isFinite(sec)) return "0:00";
  return `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, "0")}`;
}
function relTime(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 60) return `vor ${min} Min.`;
  if (min < 1440) return `vor ${Math.round(min / 60)} Std.`;
  return `vor ${Math.round(min / 1440)} Tagen`;
}

function show(loggedIn) {
  $("login").classList.toggle("hidden", loggedIn);
  $("app").classList.toggle("hidden", !loggedIn);
}

/* ---------- Player ---------- */
function setBarMeta(name, artist, artwork) {
  $("pb-cover").style.backgroundImage = artwork ? `url('${artwork}')` : "none";
  $("pb-name").textContent = name;
  $("pb-artist").textContent = artist;
  $("playerbar").classList.add("on");
  $("app").classList.add("with-player");
}
function playSource(id, src, name, artist, artwork) {
  playing = { clip: id };
  audio.src = src;
  audio.play().catch(() => { toast("Abspielen fehlgeschlagen"); stopPlay(); });
  setBarMeta(name, artist, artwork);
  render();
}
function startPlay(song, full) {
  playSource(song.clip,
    `/${full ? "full" : "preview"}?id=${song.clip}&token=${token}`,
    song.name, song.artist, song.artwork);
}
function stopPlay() {
  audio.pause();
  audio.removeAttribute("src");
  playing = null;
  $("playerbar").classList.remove("on");
  $("app").classList.remove("with-player");
  render();
}
audio.addEventListener("ended", stopPlay);
audio.addEventListener("timeupdate", () => {
  $("pb-cur").textContent = fmtTime(audio.currentTime);
  $("pb-dur").textContent = fmtTime(audio.duration);
  if (audio.duration) $("pb-seek").value = Math.round(audio.currentTime / audio.duration * 1000);
});
function setToggle(state) {
  $("pb-toggle").innerHTML = state === "loading" ? '<span class="spinner"></span>'
    : state === "playing" ? "&#10074;&#10074;" : "&#9654;";
}
audio.addEventListener("loadstart", () => setToggle("loading"));
audio.addEventListener("waiting", () => setToggle("loading"));
audio.addEventListener("playing", () => setToggle("playing"));
audio.addEventListener("pause", () => setToggle("paused"));
$("pb-toggle").onclick = () => audio.paused ? audio.play() : audio.pause();
$("pb-seek").oninput = () => { if (audio.duration) audio.currentTime = $("pb-seek").value / 1000 * audio.duration; };
$("pb-vol").value = volSlider;
$("pb-vol").oninput = () => {
  volSlider = parseInt($("pb-vol").value, 10);
  audio.volume = sliderToVolume(volSlider);
  localStorage.setItem("volSlider", volSlider);
};
$("pb-close").onclick = stopPlay;

/* ---------- Laden & Rendern ---------- */
async function load() {
  try {
    const data = await (await api("/songs")).json();
    userName = data.user; isAdmin = data.admin;
    localStorage.setItem("user", userName);
    songs = data.songs;
    lastPending = data.pending;
    $("whoami").textContent = "@" + userName;
    renderStats();
    render();
    schedulePoll();
  } catch (e) {
    if (String(e.message).includes("angemeldet")) { doLogout(); return; }
    $("list").innerHTML = `<div class="sub" style="padding:30px;text-align:center">${esc(e.message)}</div>`;
  }
}
function schedulePoll() {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(() => { if (token && !document.hidden) load(); else schedulePoll(); },
    lastPending.length ? 4000 : 12000);
}

function renderStats() {
  const week = songs.filter(s => Date.now() - new Date(s.saved_at) < 7 * 864e5).length;
  const artists = {};
  songs.forEach(s => artists[s.artist] = (artists[s.artist] || 0) + 1);
  const top = Object.entries(artists).sort((a, b) => b[1] - a[1])[0];
  $("stats").innerHTML =
    `<span class="chip">${songs.length} Songs</span>` +
    `<span class="chip">${week} diese Woche</span>` +
    (top ? `<span class="chip">Top ${esc(top[0])}</span>` : "") +
    `<span class="chip taste" id="taste">Dein Geschmack</span>`;
  $("taste").onclick = openTaste;
  $("filters").innerHTML = Object.keys(FILTER_LABEL).map(f =>
    `<span class="chip click ${f === filter ? "active" : ""}" data-f="${f}">${FILTER_LABEL[f]}</span>`).join("");
  document.querySelectorAll("#filters .chip").forEach(el =>
    el.onclick = () => { filter = el.dataset.f; renderStats(); render(); });
}

function render() {
  const q = $("search").value.toLowerCase();
  const shown = songs.filter(s => {
    const src = sourceOf(s);
    if (filter === "ALLE" ? src === "SIMILAR" : src !== filter) return false;
    return !q || (s.name || "").toLowerCase().includes(q) || (s.artist || "").toLowerCase().includes(q);
  });
  let html = "";
  if (lastPending.length) {
    const stage = lastPending[0].stage || "Wartet";
    html += `<div class="pendcard">
      <div class="pendrow"><div class="spinner"></div>
        <div>${lastPending.length === 1 ? "1 Song wird verarbeitet…" : lastPending.length + " Songs werden verarbeitet…"}
          <small>${esc(stage)}</small></div></div>
      <div class="pendbar"><div style="width:${STAGE_PROGRESS[stage] || 10}%"></div></div>
    </div>`;
  }
  if (!shown.length && !lastPending.length) {
    html += `<div class="sub" style="padding:56px 0;text-align:center;font-size:15px">&#9834;<br><br>Nichts gefunden.</div>`;
  }
  html += shown.map(s => {
    const src = sourceOf(s), info = SOURCES[src];
    const idx = songs.indexOf(s);
    const isPlaying = playing && playing.clip === s.clip;
    return `<div class="card ${isPlaying ? "playing" : ""}">
      <div class="cover" ${s.artwork ? `style="background-image:url('${esc(s.artwork)}')"` : ""} data-play="${idx}">
        <div class="ply">${isPlaying ? "&#10074;&#10074;" : "&#9654;"}</div></div>
      <div class="meta">
        <b>${esc(s.name)}</b><span class="artist">${esc(s.artist)}</span>
        <span class="badge-row"><span class="badge" style="background:${info.color}">${info.label}</span>
        <span class="time">${relTime(s.saved_at)}</span></span>
      </div>
      <button class="icon-btn bare" data-menu="${idx}" title="Aktionen">&#8942;</button>
    </div>`;
  }).join("");
  $("list").innerHTML = html;
  document.querySelectorAll("[data-play]").forEach(el => el.onclick = () => {
    const s = songs[el.dataset.play];
    if (playing && playing.clip === s.clip) stopPlay(); else startPlay(s, false);
  });
  document.querySelectorAll("[data-menu]").forEach(el => el.onclick = (ev) => {
    ev.stopPropagation();
    openSongMenu(songs[el.dataset.menu], el);
  });
}

/* ---------- Menüs, am Auslöser verankert ---------- */
function closeMenu() { document.querySelectorAll(".menu").forEach(m => m.remove()); }
document.addEventListener("click", closeMenu);

function anchorMenu(menu, anchorEl) {
  document.body.appendChild(menu);
  const a = anchorEl.getBoundingClientRect();
  const m = menu.getBoundingClientRect();
  let left = a.right - m.width;
  let top = a.bottom + 6;
  if (top + m.height > innerHeight - 8) top = a.top - m.height - 6;
  menu.style.left = Math.max(8, left) + "px";
  menu.style.top = Math.max(8, top) + "px";
}

function buildMenu(items) {
  const menu = document.createElement("div");
  menu.className = "menu";
  items.forEach(([label, fn, cls]) => {
    if (label === "h") {
      const h = document.createElement("h5"); h.textContent = fn; menu.appendChild(h);
    } else {
      const b = document.createElement("button");
      b.textContent = label; if (cls) b.className = cls;
      b.onclick = (e) => { e.stopPropagation(); closeMenu(); fn(); };
      menu.appendChild(b);
    }
  });
  return menu;
}

function openSongMenu(song, anchorEl) {
  closeMenu();
  const src = sourceOf(song);
  const isOriginal = src === "ORIGINAL", isSimilar = src === "SIMILAR";
  const items = [["h", "Abspielen"]];
  if (!isOriginal) items.push(["Ganzen Song abspielen", () => startPlay(song, true)]);
  items.push([isSimilar ? "Auf Deezer öffnen" : "TikTok öffnen", () => window.open(song.url, "_blank")]);
  if (!isOriginal) {
    items.push(["h", "Entdecken"]);
    items.push(["Ähnliche Songs", () => openSimilar(song)]);
    items.push(["Auf Spotify suchen", () =>
      window.open("https://open.spotify.com/search/" + encodeURIComponent(song.artist + " " + song.name), "_blank")]);
    items.push(["Auf YouTube Music suchen", () =>
      window.open("https://music.youtube.com/search?q=" + encodeURIComponent(song.artist + " " + song.name), "_blank")]);
  }
  items.push(["h", "Herunterladen"]);
  items.push([isOriginal ? "Sound als MP3" : "Song als MP3",
    () => window.open(`/download-mp3?id=${song.clip}&token=${token}`, "_blank")]);
  if (!isSimilar) items.push(["TikTok-Video als MP4",
    () => window.open(`/download-mp4?id=${song.clip}&token=${token}`, "_blank")]);
  items.push(["h", "Teilen"]);
  items.push(["Namen kopieren", () => {
    navigator.clipboard.writeText(`${song.artist} - ${song.name}`);
    toast("Kopiert");
  }]);
  items.push(["Löschen", async () => {
    if (playing && playing.clip === song.clip) stopPlay();
    await api("/delete", { method: "POST", body: song.saved_at });
    toast("Song gelöscht");
    load();
  }, "danger"]);
  anchorMenu(buildMenu(items), anchorEl);
}

$("profile").onclick = (ev) => {
  ev.stopPropagation();
  closeMenu();
  const items = [
    ["Name ändern", openRename],
    ["Passwort ändern", openPassword],
  ];
  if (isAdmin) items.push(["Konten verwalten", openAdmin]);
  items.push(["Abmelden", doLogout, "danger"]);
  anchorMenu(buildMenu(items), $("profile"));
};

/* ---------- Overlays ---------- */
function modal(title, bodyHtml) {
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="modal"><header><b>${title}</b>
    <button class="icon-btn bare close">&#10005;</button></header><div class="body">${bodyHtml}</div></div>`;
  ov.onclick = (e) => { if (e.target === ov) close(); };
  function close() { ov.remove(); }
  ov.querySelector(".close").onclick = close;
  $("overlays").appendChild(ov);
  return { el: ov, close };
}

async function openSimilar(seed) {
  const m = modal(`Ähnlich zu ${esc(seed.name)}`,
    `<div class="sub" style="padding:12px 0">Suche ähnliche Songs…</div>`);
  let tracks;
  try {
    tracks = (await (await api(`/similar?id=${seed.clip}`)).json()).similar;
  } catch (e) { m.el.querySelector(".body").innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  if (!tracks.length) { m.el.querySelector(".body").innerHTML = `<div class="sub">Nichts gefunden.</div>`; return; }
  m.el.querySelector(".body").innerHTML = tracks.map((t, i) => `<div class="mrow">
    <div class="cover" ${t.artwork ? `style="background-image:url('${esc(t.artwork)}')"` : ""} data-sp="${i}">
      <div class="ply">&#9654;</div></div>
    <div class="meta"><b>${esc(t.track)}</b><span class="artist">${esc(t.artist)}</span></div>
    <button class="add" data-sa="${i}" title="Merken">+</button>
  </div>`).join("");
  m.el.querySelectorAll("[data-sp]").forEach(el => el.onclick = () => {
    const t = tracks[el.dataset.sp];
    if (!t.preview) { toast("Keine Vorschau verfügbar"); return; }
    playSource("sim:" + el.dataset.sp, t.preview, t.track, t.artist, t.artwork);
  });
  m.el.querySelectorAll("[data-sa]").forEach(el => el.onclick = async () => {
    const t = tracks[el.dataset.sa];
    try {
      await api("/save-similar", { method: "POST", body: JSON.stringify(t) });
      el.textContent = "✓"; el.classList.add("done");
      toast("In deine Liste übernommen");
      load();
    } catch (e) { toast("Speichern fehlgeschlagen"); }
  });
  const origClose = m.close;
  const closeAll = () => { if (playing && String(playing.clip).startsWith("sim:")) stopPlay(); origClose(); };
  m.el.querySelector(".close").onclick = closeAll;
  m.el.onclick = (e) => { if (e.target === m.el) closeAll(); };
}

function openTaste() {
  const genres = {};
  songs.forEach(s => { if (s.genre) genres[s.genre] = (genres[s.genre] || 0) + 1; });
  const sorted = Object.entries(genres).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const max = sorted.length ? sorted[0][1] : 1;
  const artists = {};
  songs.forEach(s => artists[s.artist] = (artists[s.artist] || 0) + 1);
  const tops = Object.entries(artists).sort((a, b) => b[1] - a[1]).slice(0, 3);
  modal("Dein Geschmack",
    (sorted.length
      ? sorted.map(([g, c]) => `<div><div style="display:flex;font-size:13px;margin-bottom:5px">
          <span style="flex:1">${esc(g)}</span><span style="color:var(--muted)">${c}</span></div>
          <div class="genrebar"><div style="width:${Math.round(c / max * 100)}%"></div></div></div>`).join("")
      : `<div class="sub">Noch keine Genre-Daten. Genres kommen automatisch bei jedem erkannten Song dazu.</div>`) +
    `<b style="font-size:14px;margin-top:6px">Top-Artists</b>` +
    tops.map(([a, c]) => `<div style="display:flex;font-size:13px">
      <span style="flex:1">${esc(a)}</span><span style="color:var(--muted)">${c === 1 ? "1 Song" : c + " Songs"}</span></div>`).join(""));
}

function openRename() {
  const m = modal("Name ändern",
    `<input type="text" id="rn" placeholder="Neuer Benutzername"><div class="err" id="rn-err"></div>
     <button class="btn-primary" id="rn-btn">Speichern</button>`);
  m.el.querySelector("#rn-btn").onclick = async () => {
    try {
      const r = await api("/rename", { method: "POST",
        body: JSON.stringify({ new: m.el.querySelector("#rn").value.trim() }) });
      userName = (await r.json()).user;
      localStorage.setItem("user", userName);
      toast("Umbenannt in @" + userName);
      m.close(); load();
    } catch (e) { m.el.querySelector("#rn-err").textContent = e.message; }
  };
}

function openPassword() {
  const m = modal("Passwort ändern",
    `<input type="password" id="p-old" placeholder="Aktuelles Passwort">
     <input type="password" id="p-new" placeholder="Neues Passwort">
     <input type="password" id="p-conf" placeholder="Neues Passwort bestätigen">
     <div class="err" id="p-err"></div><button class="btn-primary" id="p-btn">Ändern</button>`);
  m.el.querySelector("#p-btn").onclick = async () => {
    const oldPw = m.el.querySelector("#p-old").value,
          newPw = m.el.querySelector("#p-new").value,
          confPw = m.el.querySelector("#p-conf").value;
    if (newPw !== confPw) { m.el.querySelector("#p-err").textContent = "Passwörter stimmen nicht überein"; return; }
    try {
      await api("/change-password", { method: "POST", body: JSON.stringify({ old: oldPw, new: newPw }) });
      toast("Passwort geändert");
      m.close();
    } catch (e) { m.el.querySelector("#p-err").textContent = e.message; }
  };
}

async function openAdmin() {
  const m = modal("Konten verwalten", `<div class="sub">Lädt…</div>`);
  async function refresh() {
    let users;
    try { users = (await (await api("/admin/users")).json()).users; }
    catch (e) { m.el.querySelector(".body").innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
    m.el.querySelector(".body").innerHTML = users.map(u => `<div class="mrow">
      <div class="meta"><b style="color:${u.admin ? "var(--cyan)" : "inherit"}">@${esc(u.name)}${u.admin ? " · Admin" : ""}</b>
        <span class="artist">${u.songs} Songs</span></div>
      <button class="add" style="font-size:13px" data-rp="${esc(u.name)}">Passwort</button>
      ${u.name !== userName ? `<button class="add" style="color:var(--pink)" data-du="${esc(u.name)}">&#128465;</button>` : ""}
    </div>`).join("");
    m.el.querySelectorAll("[data-rp]").forEach(el => el.onclick = () => {
      const target = el.dataset.rp;
      const pm = modal("Passwort für @" + esc(target),
        `<input type="password" id="ap" placeholder="Neues Passwort">
         <input type="password" id="ap2" placeholder="Neues Passwort bestätigen">
         <div class="err" id="ap-err"></div>
         <button class="btn-primary" id="ap-btn">Zurücksetzen</button>`);
      pm.el.querySelector("#ap-btn").onclick = async () => {
        const p1 = pm.el.querySelector("#ap").value, p2 = pm.el.querySelector("#ap2").value;
        if (p1 !== p2) { pm.el.querySelector("#ap-err").textContent = "Passwörter stimmen nicht überein"; return; }
        try {
          await api("/admin/reset-password", { method: "POST",
            body: JSON.stringify({ user: target, new: p1 }) });
          toast("Zurückgesetzt"); pm.close();
        } catch (e) { pm.el.querySelector("#ap-err").textContent = e.message; }
      };
    });
    m.el.querySelectorAll("[data-du]").forEach(el => el.onclick = async () => {
      if (!confirm(`Konto @${el.dataset.du} wirklich löschen?`)) return;
      await api("/admin/delete-user", { method: "POST", body: el.dataset.du });
      toast("Konto gelöscht"); refresh();
    });
  }
  refresh();
}

/* ---------- Auth ---------- */
async function doAuth() {
  $("login-err").textContent = "";
  try {
    const r = await fetch(registerMode ? "/register" : "/login", {
      method: "POST",
      body: JSON.stringify({ user: $("user").value.trim(), pass: $("pass").value }),
    });
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();
    token = data.token; userName = data.user;
    localStorage.setItem("token", token); localStorage.setItem("user", userName);
    show(true); load();
  } catch (e) { $("login-err").textContent = e.message; }
}
function doLogout() {
  stopPlay();
  localStorage.removeItem("token"); localStorage.removeItem("user");
  token = null; show(false);
}

$("login-btn").onclick = doAuth;
$("pass").addEventListener("keydown", e => { if (e.key === "Enter") doAuth(); });
$("toggle-register").onclick = () => {
  registerMode = !registerMode;
  $("login-mode").textContent = registerMode ? "Konto erstellen" : "Anmelden";
  $("login-btn").textContent = registerMode ? "Konto erstellen" : "Anmelden";
  $("toggle-register").textContent = registerMode ? "Schon ein Konto? Anmelden" : "Neu hier? Konto erstellen";
};
$("reload").onclick = load;
$("search").addEventListener("input", render);

if (token) { show(true); load(); } else { show(false); }
</script>
