<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9E64A">
<title>Syntracks</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=62">
<script>
  // Vor dem ersten Zeichnen setzen, sonst blitzt der falsche Modus auf
  const savedTheme = localStorage.getItem("theme") || "dark";
  if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
</script>
</head>
<body>

<div id="login">
  <header class="masthead">
    <div class="masthead-inner">
      <div class="titles">
        <h1 class="display">Syntracks</h1>
        <div class="sub" id="login-mode">Sign in</div>
      </div>
    </div>
  </header>
  <div class="login-body">
    <div class="login-box">
    <div class="login-form">
      <input type="text" id="user" data-ph="username" autocomplete="off" autocapitalize="off" spellcheck="false">
      <input type="password" id="pass" data-ph="password" autocomplete="off">
      <input type="password" id="pass2" data-ph="confirm_password" autocomplete="off" class="hidden">
      <div class="err" id="login-err" role="alert"></div>
      <button class="btn-primary" id="login-btn">Sign in</button>
      <button class="link-btn" id="toggle-register">New here? Create an account</button>
    </div>
    <div class="login-extras">
    <div class="tiles">
      <a class="tile" href="/app.apk" download="syntracks.apk" data-tip="download_android">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect x="8" y="2" width="16" height="28" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <rect x="13" y="25" width="6" height="2" fill="currentColor"/>
          <path d="M16 7v9m0 0 4.5-4.5M16 16l-4.5-4.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"/>
        </svg>
        <span class="tile-label" data-i18n="tile_android">Android</span></a>

      <a class="tile" href="https://chromewebstore.google.com/detail/hlecjdomfgbhajgeepojmobogolpcllg"
         target="_blank" rel="noopener" data-tip="browser_extension">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M12 2a10 10 0 0 1 8.66 5H12a5 5 0 0 0-4.9 4.02L3.6 5.9A9.98 9.98 0 0 1 12 2Z"/>
          <path d="M2.4 8.05 6.5 15.2A5 5 0 0 0 11.4 22 10 10 0 0 1 2.4 8.05Z"/>
          <path d="M21.4 8.2A10 10 0 0 1 13.6 21.8L17.9 14A5 5 0 0 0 17.4 8.2Z"/>
          <circle cx="12" cy="12" r="3.2"/>
        </svg>
        <span class="tile-label" data-i18n="tile_browser">Browser</span></a>

      <a class="tile" href="/ios" data-tip="iphone_shortcut">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect x="9" y="2" width="14" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <rect x="13" y="26" width="6" height="2" rx="1" fill="currentColor"/>
          <rect x="13.5" y="5" width="5" height="1.6" rx=".8" fill="currentColor"/>
        </svg>
        <span class="tile-label" data-i18n="tile_iphone">iPhone</span></a>

      <a class="tile" href="https://github.com/xSyntachs/syntracks" target="_blank" rel="noopener" data-tip="code_on_github">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55v-2.17c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.78 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 5.66.41.35.77 1.05.77 2.12v3.14c0 .3.21.67.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>
        <span class="tile-label" data-i18n="tile_code">Code</span></a>

      <button class="tile" id="howto-btn" data-tip="howto_title">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M11 11.5a5 5 0 1 1 6 4.9c-.9.2-1 1-1 1.9v1.2" fill="none" stroke="currentColor"
                stroke-width="3" stroke-linecap="round"/>
          <circle cx="16" cy="25.5" r="2" fill="currentColor"/>
        </svg>
        <span class="tile-label" data-i18n="tile_help">Help</span></button>
    </div>
    <div class="picks">
      <select id="lang-pick" class="btn-ghost" aria-label="Language"></select>
      <select id="theme-pick" class="btn-ghost" aria-label="Appearance"></select>
    </div>
    </div>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="masthead">
    <div class="masthead-inner">
      <div class="titles">
        <h1 class="display">Syntracks</h1>
      </div>
      <div class="profile-wrap">
        <button class="icon-btn" id="profile" aria-label="Account">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
        </button>
        <div id="whoami" role="status"></div>
      </div>
    </div>
  </header>
  <div class="filters-wrap"><nav class="chips" id="filters"></nav></div>
  <div class="content">
    <div class="chips" id="stats"></div>
    <input type="search" id="search" data-ph="search_placeholder">
    <div id="list"></div>
    <div id="pager"></div>
  </div>
</div>

<div id="playerbar">
  <div id="pb-cover"></div>
  <div id="pb-meta"><b id="pb-name"></b><span id="pb-artist"></span></div>
  <button id="pb-toggle" aria-label="Play"></button>
  <span class="pb-time" id="pb-cur">0:00</span>
  <input type="range" id="pb-seek" min="0" max="1000" value="0" aria-label="Seek">
  <span class="pb-time" id="pb-dur">0:00</span>
  <input type="range" id="pb-vol" min="0" max="100" aria-label="Volume">
  <button class="icon-btn bare" id="pb-close" aria-label="Stop">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="overlays"></div>
<script src="/app.js?v=62"></script>
</body>
</html>
