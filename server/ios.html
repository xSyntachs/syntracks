<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9E64A">
<title>Syntracks</title>
<link rel="icon" href="/favicon.png?v=2" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=66">
<script>
  const savedTheme = localStorage.getItem("theme") || "dark";
  if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
</script>
<style>
  html, body { height: auto; }
  .guide { max-width: 660px; margin: 0 auto; padding: 0 0 64px; }
  .guide-inner { padding: 0 16px; }
  .banner { background: var(--brand); color: #121212; padding: 13px 16px; }
  .banner h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 27px;
               letter-spacing: -.035em; line-height: 1; }
  .banner p { color: #121212; opacity: .82; font-size: 13px; margin-top: 5px; line-height: 1.45; }
  .banner .back { display: inline-block; margin-bottom: 9px; color: #121212; font-size: 12px;
                  font-weight: 700; text-decoration: none; opacity: .8; }
  .banner .back::before { content: "←"; margin-right: 6px; }
  .banner .back:hover { opacity: 1; text-decoration: underline; }
  .banner .clock { display: inline-block; margin-top: 9px; background: #121212; color: var(--brand);
                   font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 3px; }

  .part { margin-top: 34px; }
  .part-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .part-num { width: 26px; height: 26px; flex: none; border-radius: 3px; background: var(--ink);
              color: var(--paper); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .part-head h2 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700;
                  letter-spacing: -.02em; }

  ol.steps { list-style: none; counter-reset: step; margin: 0; padding: 0; }
  ol.steps > li { position: relative; padding: 0 0 18px 34px; border-left: 2px solid var(--line);
                  margin-left: 12px; line-height: 1.55; }
  ol.steps > li:last-child { border-left-color: transparent; padding-bottom: 0; }
  ol.steps > li::before {
    counter-increment: step; content: counter(step);
    position: absolute; left: -13px; top: -2px;
    width: 24px; height: 24px; border-radius: 3px;
    display: grid; place-items: center;
    background: var(--brand); color: #121212; font-size: 11px; font-weight: 700;
  }
  ol.steps .why { display: block; margin-top: 7px; font-size: 12.5px; color: var(--dim);
                  border-left: 3px solid var(--brand); padding-left: 10px; }

  code { border: 2px solid var(--line); padding: 3px 7px; border-radius: 3px;
         font-family: ui-monospace, monospace; font-size: 13px; white-space: nowrap; display: inline-block; }
  code.block { white-space: normal; overflow-wrap: anywhere; display: block; }
  .code-row { display: flex; align-items: center; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
  .code-row code { flex: 1; min-width: 170px; }
  .mini-copy { border: none; background: var(--btn-bg); color: var(--btn-ink); border-radius: var(--r);
               padding: 10px 16px; min-height: 44px; font-size: 13px; font-weight: 700;
               cursor: pointer; white-space: nowrap; flex: none; }
  .mini-copy.ghost { background: none; border: 2px solid var(--line); color: var(--ink); font-weight: 600; }
  .mini-copy.ghost:hover { border-color: var(--ink); }

  figure { margin: 12px 0 0; }
  figure svg.shot { width: 100%; max-width: 300px; height: auto; display: block;
                    border: 2px solid var(--line); border-radius: var(--r); }
  figcaption { font-size: 11.5px; color: var(--dim); margin-top: 6px; }

  details { border: 2px solid var(--line); border-radius: var(--r); margin-bottom: 8px; }
  details summary { cursor: pointer; padding: 13px 14px; font-weight: 600; font-size: 14px;
                    list-style: none; display: flex; align-items: center; gap: 10px; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "+"; color: var(--brand); font-weight: 700; flex: none; }
  details[open] summary::before { content: "\2212"; }
  details p { padding: 0 14px 13px 34px; color: var(--dim); font-size: 13.5px; line-height: 1.6; }
</style>
</head>
<body>
<div class="guide">
  <div class="banner">

              <path d="M25 38h10M31 34l4 4-4 4" stroke="#fff" stroke-width="1.6" fill="none"/>
              <text x="48" y="34" font-size="11" font-weight="600" fill="#000">Get contents of</text>
              <text x="48" y="49" font-size="11" font-weight="600" fill="#2F80ED">https://syntracks.app/add</text>
              <rect x="12" y="72" width="276" height="34" rx="10" fill="#fff"/>
              <text x="26" y="93" font-size="11" fill="#000">Method</text>
              <rect x="228" y="80" width="46" height="19" rx="9" fill="#E5E5EA"/>
              <text x="240" y="93" font-size="10.5" font-weight="700" fill="#000">POST</text>
              <rect x="12" y="114" width="276" height="54" rx="10" fill="#fff"/>
              <text x="26" y="132" font-size="11" fill="#000">Headers</text>
              <rect x="26" y="140" width="110" height="19" rx="4" fill="#F2F2F7"/>
              <text x="34" y="153" font-size="10" font-family="ui-monospace, monospace" fill="#000">X-Token</text>
              <rect x="146" y="140" width="128" height="19" rx="4" fill="#F2F2F7"/>
              <text x="154" y="153" font-size="10" font-family="ui-monospace, monospace" fill="#8E8E93">your code</text>
              <rect x="12" y="176" width="276" height="60" rx="10" fill="#fff"/>
              <text x="26" y="194" font-size="11" fill="#000">Request Body</text>
              <rect x="228" y="182" width="46" height="19" rx="9" fill="#E5E5EA"/>
              <text x="242" y="195" font-size="10.5" font-weight="700" fill="#000">File</text>
              <rect x="26" y="208" width="112" height="20" rx="10" fill="#D6E4FF" stroke="#2F80ED" stroke-width="1.4"/>
              <text x="36" y="222" font-size="10" font-weight="600" fill="#2F80ED">Shortcut Input</text>
            </svg>
          </figure>
        </li>
        <li>
          <span data-i18n="ios_s7"></span>
          <span class="why" data-i18n="ios_s7_why"></span>
          <figure>
            <svg class="shot" viewBox="0 0 300 250" aria-hidden="true">
              <rect width="300" height="250" rx="10" fill="#F2F2F7"/>
              <rect x="12" y="12" width="276" height="30" rx="10" fill="#fff"/>
              <text x="26" y="32" font-size="11" font-weight="700" fill="#000">Shortcut Input</text>
              <rect x="12" y="52" width="276" height="40" rx="10" fill="#fff" stroke="#E9E64A" stroke-width="3"/>
              <text x="26" y="77" font-size="11" fill="#000">Type</text>
              <text x="214" y="77" font-size="11" font-weight="700" fill="#2F80ED">Text</text>
              <path d="M266 68l5 5-5 5" stroke="#8E8E93" stroke-width="1.6" fill="none"/>
              <rect x="12" y="104" width="276" height="34" rx="10" fill="#fff"/>
              <text x="26" y="125" font-size="11" fill="#000">Name</text>
              <text x="240" y="125" font-size="11" fill="#8E8E93">Input</text>
              <rect x="12" y="150" width="276" height="86" rx="10" fill="#fff"/>
              <text x="26" y="170" font-size="10" fill="#8E8E93">Type</text>
              <rect x="26" y="180" width="72" height="22" rx="5" fill="#2F80ED"/>
              <text x="46" y="195" font-size="10" font-weight="700" fill="#fff">Text</text>
              <rect x="106" y="180" width="72" height="22" rx="5" fill="#F2F2F7"/>
              <text x="130" y="195" font-size="10" fill="#8E8E93">File</text>
              <rect x="186" y="180" width="72" height="22" rx="5" fill="#F2F2F7"/>
              <text x="204" y="195" font-size="10" fill="#8E8E93">Article</text>
            </svg>
          </figure>
        </li>
        <li data-i18n="ios_s8"></li>
      </ol>
    </section>

    <section class="part">
      <div class="part-head"><span class="part-num">2</span><h2 data-i18n="ios_part_three"></h2></div>
      <ol class="steps">
        <li data-i18n="ios_u1"></li>
        <li data-i18n="ios_u2"></li>
        <li>
          <span data-i18n="ios_u3"></span>
          <figure>
            <svg class="shot" viewBox="0 0 300 250" aria-hidden="true">
              <rect width="300" height="250" rx="10" fill="#1C1C1E"/>
              <rect x="12" y="12" width="276" height="40" rx="10" fill="#2C2C2E"/>
              <rect x="22" y="20" width="24" height="24" rx="5" fill="#FE2C55"/>
              <text x="56" y="31" font-size="10.5" font-weight="600" fill="#fff">TikTok video</text>
              <text x="56" y="44" font-size="9.5" fill="#8E8E93">tiktok.com</text>
              <rect x="12" y="64" width="276" height="72" rx="10" fill="#2C2C2E"/>
              <rect x="24" y="76" width="42" height="42" rx="10" fill="#3A3A3C"/>
              <rect x="76" y="76" width="42" height="42" rx="10" fill="#3A3A3C"/>
              <rect x="128" y="76" width="42" height="42" rx="10" fill="#3A3A3C"/>
              <rect x="180" y="76" width="42" height="42" rx="10" fill="#E9E64A"/>
              <rect x="190" y="90" width="22" height="14" rx="2" fill="none" stroke="#121212" stroke-width="2"/>
              <circle cx="196" cy="97" r="2.4" fill="#121212"/><circle cx="206" cy="97" r="2.4" fill="#121212"/>
              <text x="181" y="132" font-size="8.5" font-weight="700" fill="#E9E64A">Syntracks</text>
              <rect x="12" y="148" width="276" height="34" rx="10" fill="#2C2C2E"/>
              <text x="26" y="169" font-size="11" fill="#fff">Copy</text>
              <rect x="12" y="190" width="276" height="34" rx="10" fill="#2C2C2E"/>
              <text x="26" y="211" font-size="11" fill="#fff">Edit Actions...</text>
            </svg>
          </figure>
        </li>
      </ol>
    </section>

    <section class="part">
      <div class="part-head"><span class="part-num">?</span><h2 data-i18n="ios_help"></h2></div>
      <details><summary data-i18n="ios_q_missing"></summary><p data-i18n="ios_a_missing"></p></details>
      <details><summary data-i18n="ios_q_nolink"></summary><p data-i18n="ios_a_nolink"></p></details>
      <details><summary data-i18n="ios_q_auth"></summary><p data-i18n="ios_a_auth"></p></details>
      <details><summary data-i18n="ios_q_network"></summary><p data-i18n="ios_a_network"></p></details>
      <details><summary data-i18n="ios_q_play"></summary><p data-i18n="ios_a_play"></p></details>
    </section>

  </div>
</div>

<div id="overlays"></div>
<script>
const $ = (id) => document.getElementById(id);
const LANGS = { en: 1, de: 1, es: 1, fr: 1, pt: 1, tr: 1 };
let LANG = localStorage.getItem("lang") || (navigator.language || "en").slice(0, 2).toLowerCase();
if (!LANGS[LANG]) LANG = "en";
let I18N = {};
let hasToken = false;

const T = (key) => (I18N[key] && (I18N[key][LANG] || I18N[key].en)) || key;

function applyText() {
  document.documentElement.lang = LANG;
  document.title = T("ios_title");
  document.querySelectorAll("[data-i18n]").forEach(el => {
    if (el.id === "token" && hasToken) return;
    el.textContent = T(el.dataset.i18n);
  });
  document.querySelectorAll(".mini-copy").forEach(b => {
    if (b.id === "signout-token") { b.textContent = T("sign_out"); return; }
    b.textContent = b.id === "copy-token" && !hasToken ? T("sign_in") : T("copy");
  });
}

function showToken(value) {
  localStorage.setItem("ios_token", value);
  hasToken = true;
  $("token").textContent = value;
  $("copy-token").textContent = T("copy");
  $("signout-token").classList.remove("hidden");
}

function signOut() {
  localStorage.removeItem("ios_token");
  hasToken = false;
  $("token").textContent = T("ios_not_signed");
  $("copy-token").textContent = T("sign_in");
  $("signout-token").classList.add("hidden");
}

function loginDialog() {
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal">
    <header><b>${T("sign_in")}</b>
      <button class="icon-btn bare close" aria-label="${T("sign_in")}">
        <svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <div class="body">
      <input type="text" id="dlg-user" autocomplete="off" spellcheck="false">
      <input type="password" id="dlg-pass" autocomplete="off">
      <div class="err" id="dlg-err" role="alert"></div>
      <button class="btn-primary" id="dlg-go">${T("sign_in")}</button>
    </div></div>`;
  document.body.appendChild(overlay);
  $("dlg-user").placeholder = T("username");
  $("dlg-pass").placeholder = T("password");
  const close = () => overlay.remove();
  overlay.querySelector(".close").onclick = close;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };

  async function submit() {
    $("dlg-err").textContent = "";
    try {
      const response = await fetch("/login", {
        method: "POST",
        headers: { "Accept-Language": LANG },
        body: JSON.stringify({ user: $("dlg-user").value.trim().toLowerCase(), pass: $("dlg-pass").value }),
      });
      const body = (await response.text()).trim();
      if (!response.ok) {
        $("dlg-err").textContent = body.startsWith("<") || body.length > 200
          ? `${T("server_error")} (${response.status})` : body;
        return;
      }
      showToken(JSON.parse(body).token);
      close();
    } catch {
      $("dlg-err").textContent = T("server_unreachable");
    }
  }
  $("dlg-go").onclick = submit;
  $("dlg-pass").onkeydown = (e) => { if (e.key === "Enter") submit(); };
  $("dlg-user").focus();
}

async function copyText(button, text) {
  let done = false;
  try {
    await navigator.clipboard.writeText(text);
    done = true;
  } catch {
    const helper = document.createElement("textarea");
    helper.value = text;
    helper.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(helper);
    helper.select();
    done = document.execCommand("copy");
    helper.remove();
  }
  button.textContent = done ? T("copy_done") : T("copy_manual");
  setTimeout(() => (button.textContent = T("copy")), 2000);
}

(async function boot() {
  try { I18N = await (await fetch("/i18n.json")).json(); } catch { I18N = {}; }
  $("target-url").textContent = `${location.origin}/add`;
  const stored = localStorage.getItem("ios_token");
  if (stored) {
    hasToken = true;
    $("token").textContent = stored;
    $("signout-token").classList.remove("hidden");
  }
  applyText();
  $("signout-token").onclick = signOut;
  for (const button of document.querySelectorAll(".mini-copy")) {
    if (button.id === "signout-token") continue;
    const source = $(button.dataset.source);
    button.onclick = () => {
      if (button.id === "copy-token" && !hasToken) { loginDialog(); return; }
      copyText(button, source.textContent);
    };
    source.onclick = () => getSelection().selectAllChildren(source);
  }
})();
</script>
</body>
</html>
