<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Syntracks reveal</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body { font-family: 'Space Grotesk', sans-serif; }

  .stage { position: absolute; inset: 0; }

  .band {
    position: absolute; left: 0; right: 0; top: 50%;
    height: 0; background: #E9E64A; transform: translateY(-50%);
    animation: open .55s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay: 6s;
  }
  @keyframes open { to { height: 1000px; } }

  .inner {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 34px;
    opacity: 0; animation: fade .35s ease-out forwards; animation-delay: 6.45s;
  }
  @keyframes fade { to { opacity: 1; } }

  .tape { width: 460px; height: 286px; position: relative; }
  .tape .shell { position: absolute; inset: 0; background: #121212; border-radius: 22px; }
  .tape .window {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 250px; height: 100px; background: #E9E64A; border-radius: 50px;
  }
  .tape .hub {
    position: absolute; top: 50%; width: 74px; height: 74px; margin-top: -37px;
    border-radius: 50%; background: #121212;
    animation: spin 1.8s linear infinite; animation-delay: 6.45s;
  }
  .tape .hub.left { left: 50%; margin-left: -103px; }
  .tape .hub.right { left: 50%; margin-left: 29px; }
  .tape .hub span {
    position: absolute; left: 50%; top: 50%; width: 4px; height: 52px;
    margin: -26px 0 0 -2px; background: #E9E64A; border-radius: 2px;
  }
  .tape .hub span:nth-child(2) { transform: rotate(60deg); }
  .tape .hub span:nth-child(3) { transform: rotate(120deg); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tape .screw { position: absolute; width: 26px; height: 26px; background: #E9E64A; border-radius: 4px; }
  .tape .screw.tl { left: 30px; top: 30px; }
  .tape .screw.tr { right: 30px; top: 30px; }
  .tape .screw.bl { left: 30px; bottom: 30px; }
  .tape .screw.br { right: 30px; bottom: 30px; }

  .wave { display: flex; align-items: center; gap: 7px; height: 110px; }
  .wave i {
    display: block; width: 9px; background: #121212; border-radius: 5px;
    animation: pulse 1.1s ease-in-out infinite alternate; animation-delay: 6.45s;
  }

  .meta { text-align: center; padding: 0 70px; }
  .meta .artist {
    font-size: 46px; font-weight: 700; letter-spacing: .18em; color: #121212;
    text-transform: uppercase; opacity: .72;
  }
  .meta .title {
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;
    font-size: 104px; line-height: .98; letter-spacing: -.035em; color: #121212;
    margin-top: 12px; text-transform: uppercase;
  }

  .foot {
    position: absolute; left: 0; right: 0; bottom: 190px; text-align: center;
    color: #6E6E76; font-size: 40px; font-weight: 500;
    opacity: 0; animation: fade .4s ease-out forwards; animation-delay: 11.4s;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="band"></div>
  <div class="inner">
    <div class="tape">
      <div class="shell"></div>
      <div class="window"></div>
      <div class="hub left"><span></span><span></span><span></span></div>
      <div class="hub right"><span></span><span></span><span></span></div>
      <div class="screw tl"></div><div class="screw tr"></div>
      <div class="screw bl"></div><div class="screw br"></div>
    </div>
    <div class="wave" id="wave"></div>
    <div class="meta">
      <div class="artist" id="artist">ZAYLO</div>
      <div class="title" id="title">Montagem Uranium</div>
    </div>
  </div>
  <div class="foot" id="foot">more songs nobody could name</div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  if (params.get("artist")) document.getElementById("artist").textContent = params.get("artist");
  if (params.get("title")) document.getElementById("title").textContent = params.get("title");
  if (params.get("foot")) document.getElementById("foot").textContent = params.get("foot");

  const wave = document.getElementById("wave");
  const heights = [22, 54, 88, 40, 106, 66, 30, 92, 48, 74, 110, 36, 62, 96, 44, 80, 26, 68, 100, 52,
                   34, 86, 58, 102, 42, 76, 28, 94, 64, 38, 84, 50, 108, 32, 70, 46, 90, 60, 24, 78];
  heights.forEach((h, i) => {
    const bar = document.createElement("i");
    bar.style.height = h + "px";
    bar.style.animationDelay = (6.45 + i * 0.035) + "s";
    bar.style.setProperty("--h", h + "px");
    wave.appendChild(bar);
  });

  const sheet = document.styleSheets[document.styleSheets.length - 1];
  sheet.insertRule("@keyframes pulse { from { transform: scaleY(.35); } to { transform: scaleY(1); } }",
                   sheet.cssRules.length);
</script>
</body>
</html>
