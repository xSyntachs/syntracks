name: release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "setup/chrome_extension/**"
      - ".github/workflows/release.yml"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Version aus Run-Nummer ableiten
        # 100er-Offset hält den versionCode sicher über den 30 manuell verteilten Ständen
        run: |
          echo "VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=5.${{ github.run_number }}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.1"

      - name: Keystore entpacken
        run: echo "$KEYSTORE_B64" | base64 -d > release.keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Release bauen
        run: gradle assembleRelease --console=plain
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: version.json erzeugen
        run: |
          echo "{\"versionCode\": $VERSION_CODE, \"versionName\": \"$VERSION_NAME\"}" > version.json
          cat version.json

      - name: Extension paketieren
        run: (cd setup/chrome_extension && zip -qr ../../extension.zip .)

      - name: Auf die Bridge deployen
        run: |
          install -m 600 /dev/null deploy_key
          echo "$DEPLOY_SSH_KEY" > deploy_key
          scp -i deploy_key -o StrictHostKeyChecking=accept-new \
            app/build/outputs/apk/release/app-release.apk \
            scp@ssh.xsyntachs.de:/opt/tiktok-bridge/app.apk.neu
          scp -i deploy_key -o StrictHostKeyChecking=accept-new \
            version.json scp@ssh.xsyntachs.de:/opt/tiktok-bridge/version.json.neu
          scp -i deploy_key -o StrictHostKeyChecking=accept-new \
            extension.zip scp@ssh.xsyntachs.de:/opt/tiktok-bridge/extension.zip.neu
          # Erst die APK atomar aktivieren, dann die Versionsansage, sonst laden Apps kurz die alte APK
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new scp@ssh.xsyntachs.de \
            'mv /opt/tiktok-bridge/app.apk.neu /opt/tiktok-bridge/app.apk && mv /opt/tiktok-bridge/version.json.neu /opt/tiktok-bridge/version.json && mv /opt/tiktok-bridge/extension.zip.neu /opt/tiktok-bridge/extension.zip'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: GitHub-Release "latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk syntracks.apk
          cp extension.zip syntracks_extension.zip
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest syntracks.apk syntracks_extension.zip \
            --title "Syntracks $VERSION_NAME" \
            --notes "versionCode $VERSION_CODE, automatisch gebaut und auf der Bridge deployt." \
            --latest
